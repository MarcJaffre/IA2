########################################################################
# Nom de la tâche #
###################
name: Demo_2

########################################################################
# Déclencher #
##############
on:
 workflow_dispatch:
########################################################################
# Tâche de travail #
####################
jobs:
 Etape_1:
########################################################################
  # ====================================================================
  runs-on: ubuntu-22.04
  # ====================================================================
  container:
   image: debian:bookworm-slim
  # ====================================================================
  steps:
   # ===================================================================
   - name: Récupérer le code du dépôt
     uses: actions/checkout@v4
   # ===================================================================
   - name: Lister le contenu
     run: |
     ls -la .
     ls -la /scripts/
     ls -la /scripts/lib
   # ===================================================================
   - name: Vérifier binaire
     run: whereis source
   # ===================================================================
   - name: Charger les fichiers 
     shell: bash
     run: source ./scripts/lib/functions.sh
     
   
