########################################################################
# Nom de la tâche #
###################
name: "Building Projet IA"

########################################################################
# Déclencher #
##############
on:
 workflow_dispatch:

########################################################################
# Release Github #
##################
permissions:
  contents: write

########################################################################
# Tâche de travail #
####################
jobs:
 #######################################################################
 Etape_1:
  # ===========================================================================
  runs-on:   "ubuntu-22.04"
  container: "debian:bookworm"
  name:      "Apprentissage d'un build"
  # ===========================================================================
  steps:
   # ===========================================================================
   - name:  "Récupérer le code du dépôt"
     uses:  "actions/checkout@v4"  
   # ===========================================================================
   # Compilation automatique de llama.cpp pour Debian Bookworm.
   #- name:  "Build Release"
   #  uses:  "softprops/action-gh-release@v2"
   #  with:
   #    tag_name: "v${{ github.run_number }}"
   #    name: "Release Alpha v${{ github.run_number }}"
   #    body: "Generation d'une build de developpement, ne pas utiliser !"
   #    generate_release_notes: true
   # ===========================================================================
   - name:  "Information"
     run:   find .
   # ===========================================================================
   - name:  "Mise à jour"
     shell: "bash"
     run:   "source ./scripts/lib/functions.sh && DEBIAN_APT_BASE"
   # ===========================================================================
   - name:  "Installation des paquets de base"
     shell: "bash"
     run:   "source ./scripts/lib/functions.sh && DEBIAN_APT_TOOL"
   # ===========================================================================
   - name:  "Installation des paquets de construction"
     shell: "bash"
     run:   "source ./scripts/lib/functions.sh && DEBIAN_APT_BUILDER"
   # ===========================================================================
   - name:  "Clonage du Dépôt LLAMA.CPP"
     shell: "bash"
     run:   "source ./scripts/lib/functions.sh && LLAMA_GIT"
   # ===========================================================================
   - name:  "Configuration de la build"
     run:   |
      source ./scripts/lib/functions.sh
      cd "./llama.cpp/src"
      LLAMA_BUILD_CONFIG
    # ===========================================================================











