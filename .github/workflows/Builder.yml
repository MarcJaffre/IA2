########################################################################
# Nom de la tâche #
###################
name: "Building Projet IA"

########################################################################
# Déclencher #
##############
on:
 workflow_dispatch:

########################################################################
# Release Github #
##################
permissions:
  contents: write

########################################################################
# Tâche de travail #
####################
jobs:
 #######################################################################
 Etape_1:
  # ====================================================================
  runs-on: "ubuntu-22.04"
  container: "debian:bookworm"
  name:  "Apprentissage d'un build"
  # ====================================================================
  steps:
   # ===================================================================
   - name:  "Récupérer le code du dépôt"
     uses:  "actions/checkout@v4"
   # ===================================================================
   - name:  "Lister le contenu"
     run:   "find ./scripts"
   # ===================================================================
   - name:  "Mise à jour"
     shell: "bash"
     run: |
      source ./scripts/lib/functions.sh 
      DEBIAN_APT_BASE
      DEBIAN_APT_TOOL
      DEBIAN_APT_BUILDER
      NVIDIA_INSTALL
